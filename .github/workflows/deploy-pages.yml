name: Deploy ZaiChang Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Prepare static site
        run: |
          mkdir -p _site/assets/memory
          cp -R docs/pages/. _site/
          cp logo.jpg _site/assets/logo.jpg
          cp '《在场》封面.png' _site/assets/cover.png
          cp 在场/MemoryCardArt/focus_hour.png _site/assets/memory/focus_hour.png
          cp 在场/MemoryCardArt/after_work.png _site/assets/memory/after_work.png
          cp 在场/MemoryCardArt/rainy_desk.png _site/assets/memory/rainy_desk.png
          cp docs/archived_pages/ZaiChang_ad_vid.mp4 _site/assets/ZaiChang_ad_vid.mp4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
